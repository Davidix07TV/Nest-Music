name: Build PR

on:
  pull_request:
    branches:
      - "**"
    paths-ignore:
      - "app/src/main/res/values-*/strings.xml"
      - "app/src/main/res/values-*/metrolist_strings.xml"
      - "fastlane/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Official Keystore
        run: |
          mkdir -p app/keystore ~/.android
          if [ -n "${{ secrets.KEYSTORE }}" ]; then
            echo "Using official repository secret keystore"
            echo "${{ secrets.KEYSTORE }}" | base64 -d > app/keystore/release.keystore
            cp app/keystore/release.keystore app/persistent-debug.keystore
            cp app/keystore/release.keystore app/pr-debug.keystore
            cp app/keystore/release.keystore ~/.android/debug.keystore
          else
            echo "Generating fallback keystore"
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Nest Music,O=NestMusic,C=US"
            cp ~/.android/debug.keystore app/persistent-debug.keystore
            cp ~/.android/debug.keystore app/pr-debug.keystore
          fi

      - name: Build FOSS Release APK
        run: |
          set -o pipefail
          ./gradlew --console=plain assembleFossRelease --warning-mode summary -x lint -x lintFossRelease 2>&1 | tee build.log
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          NESTMUSIC_APPLICATION_ID: com.nestmusic.music
          NESTMUSIC_APP_NAME: Nest Music
          NESTMUSIC_DEBUG_KEYSTORE_PATH: pr-debug.keystore
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'androiddebugkey' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          PULL_REQUEST: "false"
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      # TEMPORARY DIAGNOSTICS (remove before merge)
      - name: Report build failure
        if: failure()
        continue-on-error: true
        run: |
          ERR=$(grep -E "^e: |error:|FAILED|Execution failed for task|What went wrong|Caused by:|Unresolved reference|Type mismatch|Cannot access|MissingTranslation" build.log | head -60 || true)
          echo "$ERR"
          echo "::error::GRADLE ERRORS%0A$(printf '%s' "$ERR" | sed ':a;N;$!ba;s/\n/%0A/g')"
          echo "::error::GRADLE TAIL%0A$(tail -30 build.log | sed ':a;N;$!ba;s/\n/%0A/g')"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: app-foss-release
          path: app/build/outputs/apk/foss/release/*.apk

      - name: Push APK to output branch
        if: success() && (github.head_ref == 'arena/01a0deb1-nest-music' || contains(github.head_ref, 'arena/01a0deb1-nest-music'))
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/foss/release/*.apk 2>/dev/null | head -n 1)
          if [ -z "$APK" ]; then echo "No APK found"; exit 0; fi
          cp "$APK" /tmp/nest-foss-release.apk
          ls -lh /tmp/nest-foss-release.apk
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          cd /tmp
          rm -rf apk_branch
          mkdir apk_branch
          cd apk_branch
          git init
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git fetch origin arena/01a0deb1-nest-music-apk-output 2>/dev/null || echo "branch not exists yet"
          git checkout -B arena/01a0deb1-nest-music-apk-output
          cp /tmp/nest-foss-release.apk ./Nest-Music-foss-release.apk
          echo "${{ github.sha }}" > commit.txt
          date >> commit.txt
          git add -A
          git commit -m "ci: apk from ${{ github.sha }}" || echo "nothing to commit"
          git push -f origin arena/01a0deb1-nest-music-apk-output
