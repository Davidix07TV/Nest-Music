name: Build PR

on:
  pull_request:
    branches:
      - "**"
    paths-ignore:
      - "app/src/main/res/values-*/strings.xml"
      - "app/src/main/res/values-*/metrolist_strings.xml"
      - "fastlane/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Official Keystore
        run: |
          mkdir -p app/keystore ~/.android
          if [ -n "${{ secrets.KEYSTORE }}" ]; then
            echo "Using official repository secret keystore"
            echo "${{ secrets.KEYSTORE }}" | base64 -d > app/keystore/release.keystore
            cp app/keystore/release.keystore app/persistent-debug.keystore
            cp app/keystore/release.keystore app/pr-debug.keystore
            cp app/keystore/release.keystore ~/.android/debug.keystore
          else
            echo "Generating fallback keystore"
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Nest Music,O=NestMusic,C=US"
            cp ~/.android/debug.keystore app/persistent-debug.keystore
            cp ~/.android/debug.keystore app/pr-debug.keystore
          fi

      - name: Build FOSS Release APK
        # tee keeps the full output around for the step below: the job log is
        # only readable through a host that is often unreachable from a local
        # checkout, while annotations come back on the plain REST API.
        run: |
          set -o pipefail
          ./gradlew --console=plain assembleFossRelease --warning-mode summary -x lint -x lintFossRelease 2>&1 \
            | tee /tmp/gradle.log
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          NESTMUSIC_APPLICATION_ID: com.nestmusic.music
          NESTMUSIC_APP_NAME: Nest Music
          NESTMUSIC_DEBUG_KEYSTORE_PATH: pr-debug.keystore
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'androiddebugkey' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          PULL_REQUEST: "false"
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      # A Gradle failure otherwise surfaces as a bare "exit code 1", which says
      # nothing about the compiler error that caused it. One annotation per
      # error line, like the release workflow already does.
      - name: Surface build errors
        if: failure()
        run: |
          set -e
          # A workflow command ends at the first newline, so fold the matches.
          ERRORS=$(grep -E '^e: |^\s*> Task .* FAILED|Caused by:' /tmp/gradle.log \
                    | head -15 | tr '\n' ';' || true)
          echo "::error title=build::${ERRORS:-no error line matched, see the job log}"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: app-foss-release
          path: app/build/outputs/apk/foss/release/*.apk
