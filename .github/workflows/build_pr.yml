name: Build PR

on:
  pull_request:
    branches:
      - "**"
    paths-ignore:
      - "app/src/main/res/values-*/strings.xml"
      - "app/src/main/res/values-*/metrolist_strings.xml"
      - "fastlane/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore PR debug keystore
        id: pr_keystore
        uses: actions/cache/restore@v5
        with:
          path: app/pr-debug.keystore
          key: pr-debug-keystore-${{ github.event.number || github.ref }}

      - name: Generate PR debug keystore if not cached
        if: steps.pr_keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore app/pr-debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Nest Music PR ${{ github.event.number || 'manual' }},O=NestMusic,C=US"

      - name: Save PR debug keystore
        if: steps.pr_keystore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: app/pr-debug.keystore
          key: ${{ steps.pr_keystore.outputs.cache-primary-key }}

      - name: Build FOSS Release APK
        run: ./gradlew --console=plain assembleFossRelease --warning-mode summary -x lint -x lintFossRelease
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          NESTMUSIC_APPLICATION_ID: com.nestmusic.music
          NESTMUSIC_APP_NAME: Nest Music
          NESTMUSIC_DEBUG_KEYSTORE_PATH: pr-debug.keystore
          PULL_REQUEST: "false"
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: app-foss-release
          path: app/build/outputs/apk/foss/release/*.apk
