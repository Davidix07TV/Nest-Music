name: Android release

# Publishes the Android app on every push to master:
#   1. builds and signs two APKs: the FOSS one (in-app updater) and the F-Droid/izzy one
#      (no updater, no Cast — this is what IzzyOnDroid and F-Droid serve),
#   2. names them nest-music-<versionName>.apk and nest-music-<versionName>-izzy.apk
#      (version read from app/build.gradle.kts),
#   3. attaches both to the v<versionName> release and flags that release as Latest.
#
# The release title is exactly the version name: the in-app updater compares releases, and every
# client older than the one that reads tag_name parses the title with a naive "split on dots",
# where "1.0.10 - anything" would read as 1.0.0 and never offer the update. Put the description in
# changelog.md instead.
#
# Creating the tag also wakes the desktop bundle workflows (they trigger on
# v* tag pushes and upload their AppImage/deb to the same release).
#
# workflow_dispatch accepts dry_run: builds and signs both APKs, uploads them as workflow
# artifacts and stops before touching the release (used to validate the Izzy build).

on:
  push:
    # TEMPORARY: the extra branch only serves to validate the izzy build from this work
    # branch (workflow_dispatch needs actions:write, which the automation token lacks).
    # It is removed again before the pull request is merged.
    branches: ["master", "arena/344ddab9-nest-music"]
    paths-ignore:
      - "README.md"
      - "fastlane/**"
      - "assets/**"
      - ".github/**/*.md"
      - ".github/FUNDING.yml"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and sign the APKs without publishing the release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish APK
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          # Full history so the release-notes fallback can read the git log.
          fetch-depth: 0

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || true)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts || true)
          if [ -z "$VERSION" ]; then
            echo "::error::versionName not found in app/build.gradle.kts"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Target file: nest-music-$VERSION.apk (versionCode $VERSION_CODE)"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Official Keystore
        run: |
          mkdir -p app/keystore ~/.android
          if [ -n "${{ secrets.KEYSTORE }}" ]; then
            echo "Using official repository secret keystore"
            echo "${{ secrets.KEYSTORE }}" | base64 -d > app/keystore/release.keystore
            cp app/keystore/release.keystore app/persistent-debug.keystore
            cp app/keystore/release.keystore app/pr-debug.keystore
            cp app/keystore/release.keystore ~/.android/debug.keystore
          else
            echo "Generating fallback keystore"
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Nest Music,O=NestMusic,C=US"
            cp ~/.android/debug.keystore app/persistent-debug.keystore
            cp ~/.android/debug.keystore app/pr-debug.keystore
          fi

      - name: Build Release APK (foss)
        run: |
          set -o pipefail
          ./gradlew --console=plain assembleFossRelease --warning-mode summary 2>&1 | tee gradle-build.log || status=$?
          if [ "${status:-0}" -ne 0 ]; then
            echo "::error::assembleFossRelease failed — error lines:"
            { grep -E "^e: |^FAILURE:|What went wrong|^Caused by:|^> " gradle-build.log || tail -30 gradle-build.log; } | tail -60 | sed 's/^/::error::/'
            exit "$status"
          fi
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          NESTMUSIC_APPLICATION_ID: com.nestmusic.music
          NESTMUSIC_APP_NAME: Nest Music
          NESTMUSIC_DEBUG_KEYSTORE_PATH: pr-debug.keystore
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'androiddebugkey' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          PULL_REQUEST: "false"
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Sign APK
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/foss/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 35.0.0

      - name: Rename APK to nest-music-<version>.apk
        id: apk
        run: |
          set -euo pipefail
          OUTPUT_DIR="app/build/outputs/apk/foss/release"
          mkdir -p "$OUTPUT_DIR/out"
          SIGNED_APK=$(find "$OUTPUT_DIR" -maxdepth 1 \( -name "*-signed.apk" -o -name "*-unsigned-signed.apk" \) | head -1)
          if [ -z "$SIGNED_APK" ]; then
            echo "::error::No signed APK found in $OUTPUT_DIR"
            ls -la "$OUTPUT_DIR" || true
            exit 1
          fi
          TARGET="$OUTPUT_DIR/out/nest-music-${{ steps.version.outputs.version }}.apk"
          mv "$SIGNED_APK" "$TARGET"
          echo "path=$TARGET" >> "$GITHUB_OUTPUT"
          ls -la "$OUTPUT_DIR/out/"

      # Not fatal on purpose: if the izzy build breaks, the FOSS release must still go out and the
      # F-Droid repositories simply stay one version behind until it is fixed. The run is annotated
      # and the summary marks the asset as missing.
      - name: Build Release APK (izzy, for F-Droid repositories)
        id: izzy_build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --console=plain assembleIzzyRelease --warning-mode summary 2>&1 | tee gradle-izzy-build.log || status=$?
          if [ "${status:-0}" -ne 0 ]; then
            echo "::error::assembleIzzyRelease failed — error lines:"
            { grep -E "^e: |^FAILURE:|What went wrong|^Caused by:|^> " gradle-izzy-build.log || tail -30 gradle-izzy-build.log; } | tail -60 | sed 's/^/::error::/'
            exit "$status"
          fi
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          NESTMUSIC_APPLICATION_ID: com.nestmusic.music
          NESTMUSIC_APP_NAME: Nest Music
          NESTMUSIC_DEBUG_KEYSTORE_PATH: pr-debug.keystore
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'androiddebugkey' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          PULL_REQUEST: "false"
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Sign izzy APK
        if: steps.izzy_build.outcome == 'success'
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/izzy/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 35.0.0

      - name: Rename izzy APK to nest-music-<version>-izzy.apk
        id: izzy_apk
        if: steps.izzy_build.outcome == 'success'
        run: |
          set -euo pipefail
          OUTPUT_DIR="app/build/outputs/apk/izzy/release"
          mkdir -p "$OUTPUT_DIR/out"
          SIGNED_APK=$(find "$OUTPUT_DIR" -maxdepth 1 \( -name "*-signed.apk" -o -name "*-unsigned-signed.apk" \) | head -1)
          if [ -z "$SIGNED_APK" ]; then
            echo "::error::No signed izzy APK found in $OUTPUT_DIR"
            ls -la "$OUTPUT_DIR" || true
            exit 1
          fi
          TARGET="$OUTPUT_DIR/out/nest-music-${{ steps.version.outputs.version }}-izzy.apk"
          mv "$SIGNED_APK" "$TARGET"
          echo "path=$TARGET" >> "$GITHUB_OUTPUT"
          ls -la "$OUTPUT_DIR/out/"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v6
        with:
          name: nest-music-${{ steps.version.outputs.version }}
          path: app/build/outputs/apk/*/release/out/*.apk
          if-no-files-found: error

      - name: Publish release
        # Never publish from a work branch: only master (or a non-dry-run dispatch on master).
        if: ${{ github.ref == 'refs/heads/master' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          # A PAT (RELEASE_TOKEN) makes the tag push wake the desktop bundle
          # workflows; fall back to the built-in token so publishing still
          # works if the PAT is not configured (desktop bundles then need a
          # manual workflow_dispatch with the tag input).
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          APK: ${{ steps.apk.outputs.path }}
          IZZY_APK: ${{ steps.izzy_apk.outputs.path }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          # The izzy APK is optional: the release still ships when that build failed.
          ASSETS=("$APK")
          if [ -n "${IZZY_APK:-}" ]; then
            ASSETS+=("$IZZY_APK")
          else
            echo "::warning::no izzy APK in this run — the F-Droid repositories will not get this version"
          fi
          # Prerelease versions (e.g. 1.0.7-beta) stay out of the Latest slot.
          case "$VERSION" in
            *-*) RELEASE_FLAGS="--prerelease --latest=false" ;;
            *)   RELEASE_FLAGS="--latest" ;;
          esac

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Same version published again: refresh the APK in place and keep
            # (or restore) the release flags. The title is left alone — it may
            # have been written by hand.
            EXISTING_NAME=$(gh release view "$TAG" --json name --jq '.name')
            case "$EXISTING_NAME" in
              "$VERSION"*) ;;
              *) echo "::warning::release $TAG is titled '$EXISTING_NAME' — it must start with $VERSION or older clients read it as 0.0.0 and never offer the update" ;;
            esac
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" $RELEASE_FLAGS
            echo "Updated release $TAG with fresh FOSS and izzy APKs"
          else
            # First push for this version: notes from the changelog, git log as fallback.
            if bash .github/scripts/parse_changelog.sh "$VERSION" changelog.md > release-notes.md 2>/dev/null; then
              echo "Release notes taken from changelog.md for v$VERSION"
            else
              echo "::notice::v$VERSION not found in changelog.md — falling back to git log"
              {
                echo "Nest Music v$VERSION"
                echo ""
                git log "$(git describe --tags --abbrev=0 2>/dev/null || echo 'HEAD~20')"..HEAD \
                  --pretty=format:"- %s" --no-merges | head -20 || echo "- Initial release"
              } > release-notes.md
            fi
            {
              echo "Released by @${GITHUB_ACTOR}"
              echo ""
              cat release-notes.md
            } > final-notes.md
            # The title must start with the version — and for clients released before the updater
            # learned to read tag_name it has to *be* the version: those builds parse the title with
            # a plain "split on dots, toIntOrNull" ("1.0.10" -> 1.0.10) and anything else
            # ("1.0.10 - something") reads as 1.0.0, which silently hides the update prompt.
            # Descriptive naming belongs in the release notes (changelog.md).
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "$VERSION" \
              --notes-file final-notes.md \
              --target "$GITHUB_SHA" \
              $RELEASE_FLAGS
            echo "Created release $TAG"
          fi

      - name: Publish summary
        run: |
          {
            echo "## Android release"
            echo "- **Version**: ${{ steps.version.outputs.version }} (code ${{ steps.version.outputs.version_code }})"
            echo "- **APK (FOSS, in-app updater)**: nest-music-${{ steps.version.outputs.version }}.apk"
            if [ "${{ steps.izzy_build.outcome }}" = "success" ]; then
              echo "- **APK (izzy, F-Droid repositories)**: nest-music-${{ steps.version.outputs.version }}-izzy.apk"
            else
              echo "- **APK (izzy, F-Droid repositories)**: NOT BUILT (see the izzy build step)"
            fi
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "- **Dry run**: the release was not touched, APKs are in the workflow artifacts"
            else
              echo "- **Release**: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: gradle-build-log
          path: gradle-*.log
          if-no-files-found: ignore
          retention-days: 7
