name: PR checks

on:
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: JVM unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # One step per module: the failing step name already says which module is red.
      - name: Unit tests · :app (fossDebug)
        run: ./gradlew --console=plain :app:testFossDebugUnitTest --warning-mode summary

      - name: Unit tests · :innertube
        if: ${{ !cancelled() }}
        run: ./gradlew --console=plain :innertube:testDebugUnitTest --warning-mode summary

      - name: Unit tests · :betterlyrics
        if: ${{ !cancelled() }}
        run: ./gradlew --console=plain :betterlyrics:testDebugUnitTest --warning-mode summary

      # Annotate the failing test cases so the PR page is self-describing; gradle's own
      # output only lives in the log, which is easy to skim past on a red check.
      - name: Report failing tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET

          lines = []
          for path in sorted(glob.glob('**/build/test-results/**/*.xml', recursive=True)):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for case in root.iter('testcase'):
                  for bad in list(case.iter('failure')) + list(case.iter('error')):
                      raw = (bad.get('message') or (bad.text or '')).strip().splitlines()
                      detail = raw[0][:200] if raw else 'no message'
                      detail = detail.replace('%', '%25').replace('\r', ' ').replace('\n', ' ')
                      lines.append(f"::error::{case.get('classname')} > {case.get('name')}: {detail}")

          if not lines:
              print('No JUnit XML failures found: the step probably failed before running tests '
                    '(compile error, missing SDK, or Robolectric artifact download).')
          for line in lines[:40]:
              print(line)
          if len(lines) > 40:
              print(f"::warning::{len(lines) - 40} more failing cases not annotated")
          PY

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            innertube/build/reports/tests/
            betterlyrics/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  # Blocking, but only for what a PR *introduces*: the repo already carries non-UTF-8 bytes
  # (an editor that round-tripped sources through Windows-1252), and that legacy is tracked
  # separately. This step stops the next file from being destroyed the same way.
  encoding-guard:
    name: UTF-8 (new regressions)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Reject sources this PR turns into invalid UTF-8
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          import subprocess

          EXTS = ('.kt', '.kts', '.java', '.swift', '.xml', '.py', '.js', '.jsx',
                  '.ts', '.tsx', '.proto', '.md', '.yml', '.yaml')


          def run(args):
              return subprocess.run(args, capture_output=True)


          def is_utf8(blob):
              try:
                  blob.decode('utf-8')
                  return True
              except UnicodeDecodeError:
                  return False


          def changed_files():
              for ref in ('HEAD^1 HEAD^2', 'HEAD~1 HEAD'):
                  out = run(['git', 'diff', '--name-only'] + ref.split()).stdout.decode().split()
                  if out:
                      return out
              return []


          regressions, legacy = [], []
          for path in changed_files():
              if not path.endswith(EXTS):
                  continue
              head = run(['git', 'show', f'HEAD:{path}'])
              if head.returncode != 0 or is_utf8(head.stdout):
                  continue  # deleted, or already fine
              base = run(['git', 'show', f'HEAD^1:{path}'])
              if base.returncode == 0 and not is_utf8(base.stdout):
                  legacy.append(path)
              else:
                  regressions.append(path)

          for path in regressions:
              print(f"::error file={path}::This PR makes the file invalid UTF-8. A non-UTF-8 "
                    f"charset round-trip has replaced its non-ASCII characters (in this repo that "
                    f"silently broke data tables and comparisons). Save the file as UTF-8; prefer "
                    f"\\uXXXX escapes for characters that carry meaning in code.")
          if regressions:
              raise SystemExit(1)

          if legacy:
              print('Left alone (invalid before this PR):')
              for path in legacy:
                  print('  -', path)
          else:
              print('All changed sources are valid UTF-8.')
          PY

  # Advisory only: these paths are owned by tooling, not by hand-written edits.
  # It never fails a PR, it annotates it.
  repo-hygiene:
    name: Crowdin & Room ownership (warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check owned paths
        if: github.event_name == 'pull_request'
        run: |
          set -uo pipefail
          files=$(git diff --name-only "HEAD^1" "HEAD^2" 2>/dev/null || git diff --name-only "HEAD" "HEAD~1")

          crowdin=$(printf '%s\n' "$files" | grep -E '^app/src/main/res/values-[^/]+/.*\.xml$' || true)
          if [ -n "$crowdin" ]; then
            {
              echo "::warning::These locale files are owned by the Crowdin sync and will be overwritten on the next run; new English strings belong in app/src/main/res/values/metrolist_strings.xml"
              printf '%s\n' "$crowdin"
            } | head -40
          fi

          schemas=$(printf '%s\n' "$files" | grep -E '^app/schemas/' || true)
          if [ -n "$schemas" ]; then
            {
              echo "::warning::app/schemas/ is exported by Room and must not be edited by hand; a schema change also needs a hand-written migration"
              printf '%s\n' "$schemas"
            } | head -40
          fi
